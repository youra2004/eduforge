services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: eduforge
      POSTGRES_PASSWORD: eduforge
      POSTGRES_DB: eduforge
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eduforge']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
